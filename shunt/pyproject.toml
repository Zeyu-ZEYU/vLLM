[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shunt"
version = "1.0.0"
description = "Shunt: balancing compute and KV traffic without all-to-all contention in disaggregated MoE serving"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "aiohttp", "pyzmq", "msgspec"]

[tool.setuptools]
packages = ["shunt", "shunt.runtime", "shunt.serving", "shunt.harness", "shunt.bench",
            "shunt.profiling", "shunt.analysis", "shunt.tools"]

# The C++ planner cores are built separately: make -C csrc
