# LMCache config for a Shunt DECODE worker (§4.1).
# Decode receives outbound new-KV from prefill into its CPU pool (copied to GPU
# only when scheduled) and reads any prefix KV it needs. Decode keeps EP within
# one node and runs no cross-node A2A, so it does not run the prefill-side KVLB.

chunk_size: 256
local_cpu: true
max_local_cpu_size: 32.0
use_layerwise: true

extra_config:
  mooncake_local_buffer_size: "4294967296"
  mooncake_global_segment_size: "34359738368"
  mooncake_protocol: "rdma"
  mooncake_master_server_address: "<MOONCAKE_MASTER>"
  mooncake_metadata_server: "<METADATA_SERVER>"
