# Closed-loop TTFT distributions: Figs. 13a, 14a, 15a, S5; Tables 1 (NCCL rows),
# S4, S5.
name: closed
defaults:
  trace: traces/qwen_traceB_blksz_16.jsonl
  load: closed:512
  requests: 12000
  timing: 0
runs:
